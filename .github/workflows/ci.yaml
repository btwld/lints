name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest SDK the presets support with a path plugin, and the
        # current stable release.
        sdk: ['3.12.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
        if: matrix.sdk == 'stable'
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: packages/bitwild_lints
