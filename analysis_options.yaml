# Dogfoods the presets and the plugin on this repository. Every rule except
# sort_class_members is enforced; CI runs `dart analyze --fatal-infos`.
include: package:btwld_lints/dart.yaml

plugins:
  btwld_rules:
    path: packages/btwld_rules
    diagnostics:
      avoid_barrel_imports_in_src: true
      avoid_deeply_nested_conditionals: true
      blank_line_before_return: true
      prefer_named_boolean_parameters: true
      sort_named_arguments: true
