# Analysis options for Bitwild Dart packages.
#
# In analysis_options.yaml:
#
#   include: package:bitwild_analysis/dart.yaml
#
# Builds on package:lints/recommended.yaml with the strict analyzer modes and
# the extra rules most Bitwild repositories already enable.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Async and resource safety.
    - avoid_dynamic_calls
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures

    # Likely bugs.
    - avoid_type_to_string
    - literal_only_boolean_expressions
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements

    # Shared style.
    - always_declare_return_types
    - directives_ordering
    - prefer_const_declarations
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - sort_pub_dependencies
    - strict_top_level_inference
    - unnecessary_parenthesis
