# Analysis options for Bitwild Flutter apps and packages.
#
# In analysis_options.yaml:
#
#   include: package:bitwild_analysis/flutter.yaml
#
# Adds package:flutter_lints/flutter.yaml and Flutter-specific rules to
# package:bitwild_analysis/dart.yaml.
include:
  - package:flutter_lints/flutter.yaml
  - package:bitwild_analysis/dart.yaml

linter:
  rules:
    - prefer_const_constructors
