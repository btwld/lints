# Enables the bitwild_lints analyzer plugin with its recommended rules: the bug
# checks plus the conventions that rarely fire on existing code. For every
# rule, including the ordering and formatting conventions, include
# plugin_all.yaml instead.
#
# Include it next to a preset:
#
#   include:
#     - package:bitwild_analysis/flutter.yaml
#     - package:bitwild_analysis/plugin.yaml
#
# Git plugin sources need Dart 3.13 or later (Flutter 3.47 or later). Earlier
# analysis servers ignore this block without reporting an error.
#
# In a pub workspace, include it from the root analysis_options.yaml and have
# each member's analysis_options.yaml include the root file. See
# doc/installing.md in https://github.com/btwld/lints.
plugins:
  bitwild_lints:
    git:
      url: https://github.com/btwld/lints.git
      path: packages/bitwild_lints
      ref: v0.3.0
    # Warning rules are on by default; these lint rules are opt-in.
    diagnostics:
      avoid_barrel_imports_in_src: true
      avoid_deeply_nested_conditionals: true
      prefer_named_boolean_parameters: true
