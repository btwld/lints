# Analysis options for btwld Flutter apps and packages.
#
# In analysis_options.yaml:
#
#   include: package:btwld_lints/flutter.yaml
#
# Adds package:flutter_lints/flutter.yaml and Flutter-specific rules to
# package:btwld_lints/dart.yaml.
include:
  - package:flutter_lints/flutter.yaml
  - package:btwld_lints/dart.yaml

linter:
  rules:
    - prefer_const_constructors
