# Analysis options for btwld Dart packages.
#
# In analysis_options.yaml:
#
#   include: package:btwld_lints/dart.yaml
#
# Builds on package:lints/recommended.yaml with the strict analyzer modes and
# the extra rules most btwld repositories already enable.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Async and resource safety.
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures

    # Likely bugs.
    - avoid_type_to_string
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements

    # Shared style.
    - always_declare_return_types
    - directives_ordering
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - sort_pub_dependencies
    - unnecessary_parenthesis
